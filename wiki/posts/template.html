<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Завантаження...</title>
    <meta name="description" id="meta-description" content="">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <main id="post-container">
        <h1 id="post-title">Завантаження...</h1>
        <small id="post-date"></small>
        <hr>
        <div id="post-content">
            </div>
    </main>

    <script src="../js/posts.js"></script>
    <script>
        // Ініціалізація виводу статті
        async function initPage() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            
            if (!postId) {
                document.getElementById('post-container').innerHTML = '<h1>Стаття не знайдена</h1>';
                return;
            }

            const post = await getPostById(postId);

            if (post) {
                document.title = post.title;
                document.getElementById('page-title').innerText = post.title;
                document.getElementById('meta-description').content = post.description;
                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-date').innerText = post.date;
                document.getElementById('post-content').innerHTML = post.content;
            } else {
                document.getElementById('post-container').innerHTML = '<h1>Статтю не знайдено</h1>';
            }
        }

        initPage();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Завантаження...</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/card.css">
</head>
<body>
    <nav class="back-nav">
        <a href="/" class="btn-back">Повернутися до каталогу</a>
    </nav>

    <main class="container-wide" id="product-root">
        <article class="product-grid">
            <div class="gallery-section">
                <div class="main-viewer" id="main-viewer">
                    <img id="main-img" src="" alt="Product">
                </div>
                <div class="thumbs-row" id="thumbs-row"></div>
            </div>

            <div class="info-section">
                <h1 class="product-h1" id="p-name">Завантаження...</h1>
                <div class="sku" id="p-id">SKU: ---</div>
                
                <table class="spec-table" id="p-specs"></table>

                <div class="price-tag" id="p-price">---</div>
                <a href="#" id="tg-order" class="btn-action">ЗАМОВИТИ В TELEGRAM</a>
            </div>
        </article>

        <section class="full-description">
            <h2>Опис</h2>
            <div class="text-content" id="p-desc"></div>
        </section>
    </main>

    <div id="zoom-modal"><img id="modal-img" src=""></div>
    <script src="/js/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk-UA">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Завантаження...</title>
    <meta id="meta-desc" name="description" content="">
    <meta id="meta-keys" name="keywords" content="">

    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/card.css">

    <script type="application/ld+json" id="schema-ld"></script>
</head>

<body>

    <header>
        <div class="header-inner">
            <a href="/" style="text-decoration: none; color: inherit;">
                <h1>ZX SPECTRUM GARAGE №42</h1>
            </a>
        </div>
    </header>

    <nav class="back-nav">
        <a href="/" class="btn-back">Повернутися до каталогу</a>
    </nav>

    <main class="container-wide" id="product-root">
        <div class="product-grid">
            <div class="gallery-section">
                <div class="main-viewer" id="main-viewer">
                    <img id="main-img" src="" alt="Product">
                </div>
                <div class="thumbs-row" id="thumbs-row"></div>
            </div>

            <div class="info-section">
                <h1 class="product-h1" id="p-name">Завантаження...</h1>
                <div class="sku" id="p-sku">SKU: ---</div>

                <table class="spec-table" id="p-specs">
                </table>

                <div class="price-tag" id="p-price">---</div>

                <a href="#" id="tg-order" class="btn-action">ЗАМОВИТИ В TELEGRAM</a>
            </div>
        </div>

        <div class="full-description">
            <h2>10 LOAD "ОПИС"</h2>
            <div class="text-content" id="p-desc"></div>
        </div>
        <div class="full-description" style="margin-top: 2px;">
            <h2>30 REM "ПИТАННЯ ТА ПІДТРИМКА"</h2>
            <div class="comment-box">
                <textarea id="user-comment" class="comment-input"
                    placeholder="Запитайте про наявність чи особливості налаштування..."></textarea>
                <button class="btn-comment" onclick="submitComment()">
                    Написати в ZXKIT
                </button>
            </div>
        </div>
    </main>

    <div id="zoom-modal"><img id="modal-img" src=""></div>

    <script src="/js/index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="uk-UA">

<head>
    <meta charset="UTF-8">
    <title id="page-title">Завантаження...</title>
    <meta id="meta-desc" name="description" content="">
    <meta id="meta-keys" name="keywords" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/card.css">
</head>

<body>

    <div class="back-nav">
        <a href="/components.html" class="btn-back">Назад до каталогу</a>
    </div>

    <main class="container-wide">
        <div class="product-grid" id="product-root">
            <div>
                <div class="main-viewer" id="main-viewer">
                    <img id="main-img" src="" alt="Основне фото">
                </div>
                <div class="thumbs-row" id="thumbs-row"></div>
            </div>

            <div>
                <h1 class="product-h1" id="p-name">Завантаження...</h1>
                <div class="sku" id="p-id">SKU: ---</div>

                <table class="spec-table">
                    <tr>
                        <td class="label">Аналог</td>
                        <td class="val" id="p-analog">---</td>
                    </tr>
                    <tr>
                        <td class="label">Ціна</td>
                        <td class="val price-tag" id="p-price">---</td>
                    </tr>
                </table>

                <a href="#" id="tg-order" class="btn-action">Замовити в Telegram</a>
            </div>
        </div>

        <div class="full-description">
            <h2>Детальний опис</h2>
            <div class="text-content" id="p-desc"></div>
        </div>
            <div class="full-description" style="margin-top: 2px;">
        <h2>30 REM "EXPERIMENT MODE"</h2>
        <div class="comment-box">
            <textarea id="user-comment" class="comment-input" placeholder="Запитайте про компонент..."></textarea>
            <button class="btn-comment" onclick="submitComment()">Написати в Garage №42</button>
        </div>
    </div>
    </main>

    <div id="zoom-modal">
        <img id="modal-img" src="">
    </div>
    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const mainViewerImg = document.getElementById('main-img');
            const zoomModal = document.getElementById('zoom-modal');
            const modalImg = document.getElementById('modal-img');

            if (!id) { window.location.href = '/components.html'; return; }

            try {
                const response = await fetch('/data/components.json');
                const data = await response.json();
                const product = data.find(item => item.id === id);

                if (product) {
                    // Мета-теги
                    document.getElementById('page-title').innerText = `${product.name} купити — ZX-Kit`;
                    document.getElementById('meta-desc').content = product.description;
                    document.getElementById('meta-keys').content = product.keywords;

                    // Контент
                    document.getElementById('p-name').innerText = product.name;
                    document.getElementById('p-id').innerText = `SKU: ${product.id}`;
                    document.getElementById('p-analog').innerText = product.analog;
                    document.getElementById('p-price').innerText = `${product.price} ${product.currency}`;
                    document.getElementById('p-desc').innerText = product.description;
                    document.getElementById('tg-order').href = `https://t.me/terabiterr?text=Вітаю! Хочу замовити ${product.name} (${product.id})`;

                    // Галерея
                    if (product.images && product.images.length > 0) {
                        mainViewerImg.src = product.images[0];
                        const thumbsRow = document.getElementById('thumbs-row');

                        product.images.forEach((src, index) => {
                            const img = document.createElement('img');
                            img.src = src;
                            img.className = 'thumb';
                            if (index === 0) img.classList.add('active');

                            img.onclick = () => {
                                mainViewerImg.src = src;
                                document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
                                img.classList.add('active');
                            };
                            thumbsRow.appendChild(img);
                        });
                    }

                    // Зум
                    document.getElementById('main-viewer').onclick = () => {
                        modalImg.src = mainViewerImg.src;
                        zoomModal.style.display = 'flex';
                    };
                    zoomModal.onclick = () => zoomModal.style.display = 'none';

                } else {
                    document.getElementById('product-root').innerHTML = '<h1>Товар не знайдено</h1>';
                }
            } catch (err) {
                console.error("Помилка:", err);
            }
        }

        function submitComment() {
    const comment = document.getElementById('user-comment').value;
    const productName = document.getElementById('p-name').innerText;
    if (!comment) return alert("Будь ласка, напишіть запитання!");
    
    // Формуємо повідомлення для Telegram
    const text = `Запитання по компоненту ${productName}: ${comment}`;
    window.open(`https://t.me/terabiterr?text=${encodeURIComponent(text)}`, '_blank');
}

        loadProduct();
    </script>
</body>

</html>

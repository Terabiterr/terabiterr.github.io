<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <title>Завантаження...</title> <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <main class="container">
        <article id="product-content">
            <h1 id="p-name">Завантаження...</h1>
            <img id="p-image" src="" alt="" style="max-width: 300px;">
            <p>Аналог: <span id="p-analog"></span></p>
            <div class="price-tag">Ціна: <span id="p-price"></span> UAH</div>
            <p id="p-desc"></p>
            <button onclick="orderItem()">ЗАМОВИТИ В TG</button>
        </article>
    </main>

    <script>
        // Получаем ID из URL (например, template.html?id=4164-15nl)
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        fetch('/data/components.json')
            .then(res => res.json())
            .then(data => {
                const product = data.find(item => item.id === productId);
                if (product) {
                    document.title = `${product.name} — ZX-Kit`;
                    document.getElementById('p-name').innerText = product.name;
                    document.getElementById('p-analog').innerText = product.analog;
                    document.getElementById('p-price').innerText = product.price;
                    document.getElementById('p-desc').innerText = product.description;
                    document.getElementById('p-image').src = product.image;
                } else {
                    document.body.innerHTML = '<h1>Товар не знайдено</h1><a href="/components.html">Назад до каталогу</a>';
                }
            });

        function orderItem() {
            const name = document.getElementById('p-name').innerText;
            window.location.href = `https://t.me/terabiterr?text=Вітаю! Хочу замовити ${name}`;
        }
    </script>
</body>
</html>

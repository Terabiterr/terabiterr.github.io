<!DOCTYPE html>
<html lang="uk-UA">

<head>
    <meta charset="UTF-8">
    <title>Радіокомпоненти для ZX Spectrum | Купити в Україні — ZX-Kit</title>
    <meta name="description"
        content="Каталог радіокомпонентів для ремонту та збірки ZX Spectrum: мікросхеми, пам'ять, плати розширення. Замовляйте в Україні.">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <div class="spectrum-bar">
        <div class="bar-red"></div>
        <div class="bar-yellow"></div>
        <div class="bar-green"></div>
        <div class="bar-cyan"></div>
    </div>

    <header>
        <div class="header-inner">
            <h1 class="zx-title">ZX-KIT: RADIO COMPONENTS</h1>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="sidebar-box">
                <div class="box-title">MENU.SYS</div>
                <a href="/" class="contact-link"> >> ГОЛОВНА</a>
                <a href="/components.html" class="contact-link"> >> КОМПОНЕНТИ</a>
            </div>
        </aside>

        <section id="catalog-section">
            <h2 style="color: var(--zx-yellow); border-left: 4px solid var(--zx-cyan); padding-left: 10px;">
                БАЗА КОМПОНЕНТІВ [PARTS_DATABASE]
            </h2>
            <div class="catalog-controls">
                <input type="text" id="search-input" placeholder="Пошук компонентів...">
                <div class="filters">
                    <button onclick="filterComponents('all')">Всі</button>
                    <button onclick="filterComponents('ceramic')">Кераміка</button>
                </div>
            </div>
            <div id="pagination" class="pagination-container"></div>
            <div class="grid" id="components-list"></div>
        </section>
    </main>
    <script src="/js/index.js"></script>
    <script src="/js/components.js"></script>
</body>

</html>

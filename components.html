<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <title>Радіокомпоненти для ZX Spectrum | Купити в Україні — ZX-Kit</title>
    <meta name="description" content="Каталог радіокомпонентів для ремонту та збірки ZX Spectrum: мікросхеми, пам'ять, плати розширення. Замовляйте в Україні.">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>ZX-KIT: RADIO COMPONENTS</h1>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="sidebar-box">
                <div class="box-title">MENU.SYS</div>
                <a href="/" class="contact-link"> >> ГОЛОВНА</a>
                <a href="/components.html" class="contact-link"> >> КОМПОНЕНТИ</a>
            </div>
        </aside>

        <section id="catalog-section">
            <h2 style="color: var(--zx-yellow); border-left: 4px solid var(--zx-cyan); padding-left: 10px;">
                БАЗА КОМПОНЕНТІВ [PARTS_DATABASE]
            </h2>
            <div class="grid" id="components-list">
                </div>
        </section>
    </main>

    <script>
        // Скрипт загрузки базы
        fetch('/data/components.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('components-list');
                list.innerHTML = data.map(item => `
                    <article class="card">
                        <h3>${item.name}</h3>
                        <p style="font-size: 10px; color: var(--zx-magenta);">Аналог: ${item.analog}</p>
                        <div class="card-price">${item.price} ${item.currency}</div>
                        <a href="${item.url}" class="card-link" style="text-decoration: underline;">ДЕТАЛЬНІШЕ >></a>
                    </article>
                `).join('');
            });
    </script>
</body>
</html>
